<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Robert Suter — eBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fa; color: #2c3e50; }

  header {
    background: linear-gradient(135deg, #1a1a2e, #2c3e50);
    color: white;
    text-align: center;
    padding: 40px 20px 30px;
  }
  header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; }
  header p  { color: rgba(255,255,255,0.7); margin-top: 8px; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
    max-width: 1100px;
    margin: 36px auto;
    padding: 0 20px;
  }

  .card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.13); }

  .card-cover {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .card-body {
    padding: 16px 18px 10px;
    flex: 1;
  }
  .card-body h2 { font-size: 0.97rem; font-weight: 800; line-height: 1.35; color: #1a1a2e; }
  .card-body p  { font-size: 0.83rem; color: #666; margin-top: 8px; line-height: 1.6; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 16px;
  }
  .price { font-size: 1.2rem; font-weight: 900; color: #2c3e50; }
  .price span { font-size: 0.72rem; color: #aaa; font-weight: 400; margin-left: 3px; }

  .btn-buy {
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-buy:hover  { opacity: 0.88; transform: scale(1.03); }
  .btn-buy:active { transform: scale(0.97); }
  .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .modal h3 { font-size: 1.2rem; margin-bottom: 8px; }
  .modal p  { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
  .modal input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus { border-color: #3498db; }
  .modal .btn-confirm {
    width: 100%;
    background: linear-gradient(135deg, #2c3e50, #3498db);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .modal .btn-cancel {
    width: 100%;
    background: none;
    border: none;
    color: #aaa;
    margin-top: 10px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #aaa;
    font-size: 0.82rem;
  }
  footer a { color: #3498db; text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>📚 Robert Suter — eBooks</h1>
  <p>Instant download · Delivered to your email · PDF · Read on any device</p>
</header>

<div class="grid" id="bookGrid"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Almost there! 📧</h3>
    <p>Enter your email and we'll send your download link right after payment.</p>
    <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
    <button class="btn-confirm" id="btnConfirm">Go to Checkout →</button>
    <button class="btn-cancel" id="btnCancel">Cancel</button>
  </div>
</div>

<footer>
  <p>© 2026 Robert Suter · <a href="https://wordsandwheels.net">wordsandwheels.net</a></p>
  <p style="margin-top:6px;">Secure checkout powered by Stripe · PDF delivered instantly by email</p>
</footer>

<script>
const CHECKOUT_URL = "https://api.base44.com/api/apps/69b1cf645256e83c174a7c51/functions/stripeCheckoutInstant";

const BOOKS = [
  {
    id: "happiness",
    title: "Happiness Finds Big Man",
    desc: "A gentle giant who has everything the world says matters — yet something is missing. A heartfelt story about what it truly means to find joy, purpose, and belonging.",
    cover: "https://base44.app/api/apps/69b1cf645256e83c174a7c51/files/mp/public/69b1cf645256e83c174a7c51/254fdf8cf_happiness.jpg",
    price: "$4.99",
    amount: 499,
  },
  {
    id: "valley_fair",
    title: "Just Another Typical Day in Valley Fair",
    desc: "In the quirky town of Valley Fair, no day is ever truly typical. A charming, funny, and surprisingly moving story about community, chaos, and the magic hiding in ordinary life.",
    cover: "https://base44.app/api/apps/69b1cf645256e83c174a7c51/files/mp/public/69b1cf645256e83c174a7c51/eb3a9e745_valley_fair.jpg",
    price: "$4.99",
    amount: 499,
  },
  {
    id: "salvager_1",
    title: "The Salvager — Book 1: A Sister's Plea",
    desc: "When his sister goes missing in the lawless outer zones, one man will risk everything to bring her home. A gripping sci-fi adventure where loyalty is the only currency that matters.",
    cover: "https://base44.app/api/apps/69b1cf645256e83c174a7c51/files/mp/public/69b1cf645256e83c174a7c51/54fa3d2bd_salvager_1.jpg",
    price: "$4.99",
    amount: 499,
  },
  {
    id: "salvager_2",
    title: "The Salvager — Book 2: The Runaway Daughter",
    desc: "The mission isn't over. A runaway girl holds secrets that could unravel everything — and saving her means walking straight into the enemy's territory. The stakes just got personal.",
    cover: "https://base44.app/api/apps/69b1cf645256e83c174a7c51/files/mp/public/69b1cf645256e83c174a7c51/4585c1708_salvager_2.jpg",
    price: "$4.99",
    amount: 499,
  },
  {
    id: "salvager_3",
    title: "The Salvager — Book 3: The Network",
    desc: "The conspiracy runs deeper than anyone imagined. To bring it all down, he'll have to trust people he's never trusted before. The thrilling conclusion to The Salvager trilogy.",
    cover: "https://base44.app/api/apps/69b1cf645256e83c174a7c51/files/mp/public/69b1cf645256e83c174a7c51/ac77fa826_salvager_3.jpg",
    price: "$4.99",
    amount: 499,
  },
];

const grid = document.getElementById("bookGrid");
BOOKS.forEach(book => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img class="card-cover" src="${book.cover}" alt="${book.title}">
    <div class="card-body">
      <h2>${book.title}</h2>
      <p>${book.desc}</p>
    </div>
    <div class="card-footer">
      <div class="price">${book.price} <span>PDF</span></div>
      <button class="btn-buy" data-id="${book.id}" data-amount="${book.amount}" data-title="${book.title}">Buy Now</button>
    </div>
  `;
  grid.appendChild(card);
});

let selectedBook = null;
const modalBg    = document.getElementById("modalBg");
const emailInput = document.getElementById("emailInput");
const btnConfirm = document.getElementById("btnConfirm");
const btnCancel  = document.getElementById("btnCancel");

document.getElementById("bookGrid").addEventListener("click", e => {
  const btn = e.target.closest(".btn-buy");
  if (!btn) return;
  selectedBook = { id: btn.dataset.id, amount: parseInt(btn.dataset.amount), title: btn.dataset.title };
  emailInput.value = "";
  modalBg.classList.add("open");
  setTimeout(() => emailInput.focus(), 100);
});

btnCancel.addEventListener("click", () => { modalBg.classList.remove("open"); selectedBook = null; });
modalBg.addEventListener("click", e => { if (e.target === modalBg) { modalBg.classList.remove("open"); selectedBook = null; } });

btnConfirm.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  if (!email || !email.includes("@")) { emailInput.style.borderColor = "red"; return; }
  emailInput.style.borderColor = "#e0e0e0";
  btnConfirm.disabled = true;
  btnConfirm.textContent = "Redirecting...";

  try {
    const res = await fetch(CHECKOUT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email,
        bookId: selectedBook.id,
        bookTitle: selectedBook.title,
        amount: selectedBook.amount,
        isEbook: true,
        languages: [],
        isBundle: false,
        isBusiness: false,
      }),
    });
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      alert("Something went wrong. Please try again.");
      btnConfirm.disabled = false;
      btnConfirm.textContent = "Go to Checkout →";
    }
  } catch (err) {
    alert("Network error. Please try again.");
    btnConfirm.disabled = false;
    btnConfirm.textContent = "Go to Checkout →";
  }
});

emailInput.addEventListener("keydown", e => { if (e.key === "Enter") btnConfirm.click(); });
</script>
</body>
</html>
